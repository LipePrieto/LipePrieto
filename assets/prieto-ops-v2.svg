<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1400" y2="520" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0B0F14"/>
    <stop offset="1" stop-color="#101820"/>
  </linearGradient>
  <linearGradient id="accent" x1="70" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#5EEAD4"/>
    <stop offset="0.65" stop-color="#2DD4BF"/>
    <stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#22303A" stroke-width="0.7" opacity="0.30"/>
  </pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

